name: Publish Release

on:
  workflow_run:
    workflows: ["Windows CI"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version
        shell: pwsh
        run: |
          $metadata = Get-Content version.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($metadata.version)) {
            throw "version.json does not contain a version."
          }

          $notes = "docs/releases/$($metadata.version).md"
          if (-not (Test-Path $notes)) {
            throw "Release notes are missing: $notes"
          }

          "VERSION=$($metadata.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Publishing validated Ghost Server $($metadata.version)"

      - name: Download validated Windows release candidates
        uses: actions/download-artifact@v4
        with:
          name: GhostServer-windows-release
          path: artifacts/release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify validated release files
        shell: pwsh
        run: |
          foreach ($file in @(
            "artifacts/release/GhostServer-Portable.exe",
            "artifacts/release/GhostServer-Setup.exe"
          )) {
            if (-not (Test-Path $file)) {
              throw "$file is missing from the validated CI artifact."
            }

            $size = (Get-Item $file).Length
            if ($size -lt 1MB) {
              throw "$file is unexpectedly small: $size bytes"
            }

            Write-Host "Validated CI artifact: $file ($size bytes)"
          }

      - name: Generate SHA-256 checksums and provenance
        shell: pwsh
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATED_RUN_ID: ${{ github.event.workflow_run.id }}
          VALIDATED_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          $files = @(
            "artifacts/release/GhostServer-Portable.exe",
            "artifacts/release/GhostServer-Setup.exe"
          )

          $hashes = @{}
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            $name = Split-Path $file -Leaf
            $hashes[$name] = $hash
            "$hash  $name"
          }

          $lines | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii

          @(
            "Ghost Server release provenance"
            "Version: $env:VERSION"
            "Validated commit: $env:VALIDATED_SHA"
            "Validated Windows CI run: $env:VALIDATED_RUN_ID"
            "Validated Windows CI URL: $env:VALIDATED_RUN_URL"
            "Artifact: GhostServer-windows-release"
            "GhostServer-Portable.exe SHA256: $($hashes['GhostServer-Portable.exe'])"
            "GhostServer-Setup.exe SHA256: $($hashes['GhostServer-Setup.exe'])"
            "Release workflow rebuild: no"
          ) | Set-Content artifacts/release/BUILD-PROVENANCE.txt -Encoding ascii

          Get-Content artifacts/release/SHA256SUMS.txt
          Get-Content artifacts/release/BUILD-PROVENANCE.txt

      - name: Publish immutable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $tag = "v$env:VERSION"
          $notes = "docs/releases/$env:VERSION.md"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Refusing to overwrite immutable release assets."
          }

          gh release create $tag artifacts/release/GhostServer-Portable.exe artifacts/release/GhostServer-Setup.exe artifacts/release/SHA256SUMS.txt artifacts/release/BUILD-PROVENANCE.txt --target $env:VALIDATED_SHA --title "Ghost Server $env:VERSION" --notes-file $notes --repo $env:GITHUB_REPOSITORY
